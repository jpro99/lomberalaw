name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Duplicate copy check (warn-only)
        env:
          DUPLICATE_COPY_MODE: warn
        run: npm run check:duplicate-copy -- --write-report
      - run: npm run build
